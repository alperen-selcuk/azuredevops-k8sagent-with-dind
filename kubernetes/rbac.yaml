apiVersion: v1
kind: ServiceAccount
metadata:
  name: azagent
  namespace: azagent
---
# Cluster-wide deploy access: the agent can deploy (kubectl/helm) into every namespace.
# The built-in "edit" role covers workloads, services, configmaps, secrets, ingresses, etc.
# It does NOT cover cluster-scoped resources (CRDs, ClusterRoles, namespaces); use "cluster-admin" if helm charts need those.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: azagent-cluster-edit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: azagent
  namespace: azagent
